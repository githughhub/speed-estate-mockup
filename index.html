<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speed Estate · Marketplace mock-up (GROK-36)</title>
<meta name="description" content="Speed Estate marketplace interactive mock-up. Front end only, example data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230F5B63'/%3E%3Cpath d='M9 22 L20 11 L31 22' fill='none' stroke='%23F5F2EA' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M14 27h17M10 31h13' stroke='%23FF6A3D' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{
  --teal:#0F5B63;--teal-2:#14808A;--mint:#7FD8CB;--slate:#1F3A4B;--signal:#FF6A3D;--signal-ink:#3A1305;--gold:#F2B544;--violet:#7C5CFF;--sky:#3B82F6;--ok:#12A26B;--warn:#E8A317;--bad:#E5484D;
  --bg:#F5F2EA;--bg-2:#ECE7DB;--card:#FFFFFF;--card-2:#FBFAF6;--ink:#10232C;--ink-2:#3C525C;--muted:#66787F;--line:#E2DCCD;--glass:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(16,35,44,.06),0 8px 28px rgba(16,35,44,.08);--shadow-lg:0 30px 80px rgba(16,35,44,.22);
  --r:18px;--r-sm:12px;--ease:cubic-bezier(.2,.8,.2,1);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;--f-ui:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme=dark]{
  --bg:#0A161B;--bg-2:#0F1F26;--card:#11232B;--card-2:#0E1D24;--ink:#EAF3F2;--ink-2:#BCD0D0;--muted:#8AA3A6;--line:#1F3841;--glass:rgba(13,29,36,.72);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--teal-2:#2BB3B0;--mint:#8BE6D8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1200px 600px at 110% -10%,color-mix(in oklab,var(--mint) 22%,transparent),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,color-mix(in oklab,var(--signal) 10%,transparent),transparent 60%)}
a{color:var(--teal-2);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;line-height:1.1;letter-spacing:-.02em}
.display{font-family:var(--f-display);font-weight:600;font-variation-settings:"opsz" 144,"SOFT" 50}
.mono{font-family:var(--f-mono);font-feature-settings:"tnum"}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.app.notes-on{grid-template-columns:248px 1fr 360px}
.top{grid-column:1/-1;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .w1{font-style:italic;font-weight:900}
.brand .w2{font-family:var(--f-display);font-weight:500;font-style:normal}
.mockchip{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--gold);color:#2b1d00;white-space:nowrap}
.top .grow{flex:1}
.roles{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.roles button{border:0;background:transparent;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:650;cursor:pointer;color:var(--ink-2);white-space:nowrap;transition:all .25s var(--ease)}
.roles button[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--signal);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.demo-btn{border:0;cursor:pointer;padding:9px 14px;border-radius:12px;font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--signal),#FF9F43);color:#2a0d00;box-shadow:0 6px 20px color-mix(in oklab,var(--signal) 45%,transparent);white-space:nowrap}
.demo-btn:hover{filter:brightness(1.05)}

.side{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:16px 12px 24px;border-right:1px solid var(--line)}
.side h6{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.side a:hover{background:var(--bg-2);text-decoration:none}
.side a.on{background:var(--ink);color:var(--bg)}
.side a .k{margin-left:auto;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--bg-2);color:var(--muted)}
.side a.on .k{background:rgba(255,255,255,.15);color:var(--bg)}
.side a.dim{opacity:.55}
.side .modebox{margin:16px 6px;padding:12px;border-radius:14px;border:1px dashed var(--line);font-size:12.5px}

main{min-width:0;padding:26px clamp(14px,3vw,40px) 120px}
.view{animation:viewIn .5s var(--ease) both;max-width:1240px;margin:0 auto}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Notes drawer ---------- */
.notes{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;border-left:1px solid var(--line);background:color-mix(in oklab,var(--card) 70%,transparent);padding:18px 16px 40px;display:none}
.app.notes-on .notes{display:block;animation:slideIn .35s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
.notes .nh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.notes .nh b{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.gk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--teal);color:#fff;font-weight:900;font-size:13px;font-family:var(--f-mono)}
.note{border:1px solid var(--line);border-left:4px solid var(--teal-2);background:var(--card);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.note.q{border-left-color:var(--signal)}.note.p{border-left-color:var(--gold)}.note.v{border-left-color:var(--ok)}.note.u{border-left-color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px;background:var(--bg-2);color:var(--ink-2)}
.tag.brd{background:color-mix(in oklab,var(--teal-2) 18%,transparent);color:var(--teal-2)}
.tag.ali{background:var(--signal);color:#fff}.tag.vik{background:var(--violet);color:#fff}.tag.hugh{background:var(--sky);color:#fff}
.tag.prop{background:var(--gold);color:#2b1d00}.tag.ver{background:var(--ok);color:#fff}.tag.unv{background:var(--muted);color:#fff}.tag.concept{background:var(--violet);color:#fff}.tag.p2{background:#111;color:var(--gold)}
[data-theme=dark] .tag.p2{background:var(--gold);color:#111}

/* ---------- Primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;padding:11px 18px;border-radius:12px;font-weight:750;font-size:14.5px;background:var(--ink);color:var(--bg);transition:transform .15s var(--ease),box-shadow .2s,background .2s;text-decoration:none!important;min-height:44px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.teal{background:var(--teal);color:#fff}.btn.signal{background:var(--signal);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:34px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:750;padding:4px 10px;border-radius:99px;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.pill.a{background:color-mix(in oklab,var(--signal) 16%,transparent);color:color-mix(in oklab,var(--signal) 80%,var(--ink))}
.pill.b{background:color-mix(in oklab,var(--violet) 16%,transparent);color:color-mix(in oklab,var(--violet) 75%,var(--ink))}
.pill.ok{background:color-mix(in oklab,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in oklab,var(--warn) 20%,transparent);color:color-mix(in oklab,var(--warn) 70%,var(--ink))}
.pill.bad{background:color-mix(in oklab,var(--bad) 16%,transparent);color:var(--bad)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-2)}
.h1{font-family:var(--f-display);font-size:clamp(30px,4.2vw,52px);font-weight:600;letter-spacing:-.03em}
.h2{font-family:var(--f-display);font-size:clamp(22px,2.6vw,32px);font-weight:600}
.h3{font-size:17px;font-weight:800}
label.f{display:block;font-size:12.5px;font-weight:750;color:var(--ink-2);margin:12px 0 6px}
.in,select.in,textarea.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);min-height:44px;transition:border .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--teal-2);box-shadow:0 0 0 4px color-mix(in oklab,var(--teal-2) 20%,transparent)}
input[type=range]{width:100%;accent-color:var(--signal)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);margin:8px 0;cursor:pointer}
.check:hover{border-color:var(--teal-2)}
.seg{display:inline-flex;background:var(--bg-2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);font-size:13.5px}
.banner.warn{border-color:color-mix(in oklab,var(--warn) 50%,var(--line));background:color-mix(in oklab,var(--warn) 9%,var(--card))}
.banner.p2{border:1px dashed var(--gold);background:color-mix(in oklab,var(--gold) 10%,var(--card))}
.banner.info{border-color:color-mix(in oklab,var(--teal-2) 40%,var(--line))}
hr.s{border:0;border-top:1px solid var(--line);margin:16px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;text-align:right}

/* ---------- Landing ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(26px,5vw,60px);background:linear-gradient(135deg,#0B2F35 0%,#0F5B63 55%,#14808A 100%);color:#F5F2EA;box-shadow:var(--shadow-lg)}
.hero .lines{position:absolute;inset:0;pointer-events:none;opacity:.5}
.hero .lines i{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(127,216,203,.9),transparent);animation:zoom 2.8s linear infinite}
@keyframes zoom{from{transform:translateX(-40%)}to{transform:translateX(140%)}}
@media (prefers-reduced-motion:reduce){.hero .lines i,.view,.ticker{animation:none!important}}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,6.4vw,84px);letter-spacing:-.04em;line-height:.95}
.hero h1 em{font-style:italic;color:var(--mint)}
.hero .one{font-family:var(--f-display);font-size:clamp(90px,14vw,190px);line-height:.8;font-weight:700;color:transparent;-webkit-text-stroke:2px rgba(127,216,203,.65);position:absolute;right:4%;bottom:-6%;letter-spacing:-.06em;user-select:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.2fr .9fr;gap:30px;align-items:end}
.calc{background:rgba(245,242,234,.97);color:#10232C;border-radius:22px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
[data-theme=dark] .calc{background:#0E1D24;color:var(--ink)}
.big{font-family:var(--f-display);font-size:clamp(34px,4vw,48px);font-weight:700;letter-spacing:-.03em;line-height:1}
.how{counter-reset:h;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.how .st{position:relative;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .25s var(--ease),border .25s}
.how .st:hover,.how .st.on{transform:translateY(-4px);border-color:var(--teal-2)}
.how .st::before{counter-increment:h;content:"0" counter(h);font-family:var(--f-mono);font-size:12px;color:var(--signal);font-weight:800}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pathcard{position:relative;overflow:hidden;border-radius:22px;padding:24px;border:1px solid var(--line);background:var(--card)}
.pathcard .pc-big{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;letter-spacing:-.04em}
.pathcard.a .pc-big{color:var(--signal)}.pathcard.b .pc-big{color:var(--violet)}

/* ---------- Search / listings ---------- */
.search-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.search-layout.list-only{grid-template-columns:1fr}
.search-layout.map-only .lst{display:none}.search-layout.map-only{grid-template-columns:1fr}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);position:relative;z-index:5}
.filters .fi{display:flex;flex-direction:column;gap:4px;min-width:120px;flex:1}
.filters .fi span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lc{position:relative;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border .3s;animation:viewIn .45s var(--ease) both}
.lc:hover,.lc.hl{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--teal-2)}
.lc .art{aspect-ratio:16/10;display:block;width:100%}
.lc .art svg{width:100%;height:100%;display:block}
.lc .b{padding:12px 14px 14px}
.lc .price{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.lc .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.lc .badges .pill{background:rgba(255,255,255,.92);color:#10232C;backdrop-filter:blur(6px)}
.lc .badges .pill.a{background:var(--signal);color:#fff}.lc .badges .pill.b{background:var(--violet);color:#fff}
.lc .save{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;font-size:17px;transition:transform .2s}
.lc .save:hover{transform:scale(1.12)}
.lc .attrib{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.mapwrap{position:sticky;top:76px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#CFE7E9,#E8F1EA);box-shadow:var(--shadow)}
[data-theme=dark] .mapwrap{background:linear-gradient(180deg,#0B2229,#0E1D24)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer;transition:transform .25s var(--ease);transform-box:fill-box;transform-origin:50% 100%}
.pin:hover,.pin.hl{transform:scale(1.35)}
.pin text{font:800 10px var(--f-ui);fill:#fff;pointer-events:none}
.maplegend{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.maptip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow-lg);transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .15s}
.maptip.show{opacity:1}

/* ---------- Detail ---------- */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;border-radius:22px;overflow:hidden;height:min(460px,52vw)}
.gallery .g{position:relative;overflow:hidden;cursor:zoom-in;background:var(--bg-2)}
.gallery .g:first-child{grid-row:1/3}
.gallery .g svg{width:100%;height:100%;display:block;transition:transform .8s var(--ease)}
.gallery .g:hover svg{transform:scale(1.05)}
.gallery .g span{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start;margin-top:22px}
.sticky{position:sticky;top:76px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.facts div{padding:12px;border-radius:14px;background:var(--card-2);border:1px solid var(--line)}
.facts b{display:block;font-family:var(--f-display);font-size:22px}
.attrib-box{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--card-2)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(5,14,18,.88);display:grid;place-items:center;padding:30px;animation:viewIn .25s}
.lightbox svg{max-width:min(1100px,94vw);max-height:80vh;border-radius:18px}

/* ---------- Wizard ---------- */
.steps{display:flex;gap:6px;margin:14px 0 20px;flex-wrap:wrap}
.steps .s{flex:1;min-width:84px;padding:8px 10px;border-radius:12px;background:var(--bg-2);font-size:12px;font-weight:750;color:var(--muted);position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left}
.steps .s.done{color:var(--ink-2)}.steps .s.on{background:var(--ink);color:var(--bg)}
.steps .s.done::after{content:"✓";position:absolute;right:8px;top:8px;color:var(--ok);font-weight:900}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ph{aspect-ratio:4/3;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;font-size:12px;font-weight:700;color:var(--muted);transition:border .2s}
.ph.has{border-style:solid;border-color:var(--ok)}.ph svg{width:100%;height:100%}

.meter{height:12px;border-radius:99px;background:var(--bg-2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok));transition:width 1s var(--ease)}
.rangebar{position:relative;height:56px;margin:18px 0 8px}
.rangebar .track{position:absolute;top:24px;left:0;right:0;height:8px;border-radius:9px;background:var(--bg-2)}
.rangebar .band{position:absolute;top:20px;height:16px;border-radius:9px;background:linear-gradient(90deg,color-mix(in oklab,var(--teal-2) 40%,transparent),var(--teal-2),color-mix(in oklab,var(--teal-2) 40%,transparent));transition:all .8s var(--ease)}
.rangebar .mark{position:absolute;top:8px;width:4px;height:40px;border-radius:3px;background:var(--signal);transition:left .8s var(--ease)}
.rangebar .lbl{position:absolute;top:-6px;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap}
.sigpad{font-family:"Brush Script MT","Segoe Script",cursive;font-size:28px;border:0;border-bottom:2px solid var(--ink);background:transparent;width:100%;padding:6px 2px;min-height:48px}

/* ---------- Offers ---------- */
.thread{display:flex;flex-direction:column;gap:10px}
.bub{max-width:80%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card-2);animation:viewIn .4s var(--ease)}
.bub.me{align-self:flex-end;background:color-mix(in oklab,var(--teal-2) 12%,var(--card));border-color:color-mix(in oklab,var(--teal-2) 35%,var(--line))}

.states span{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--bg-2);color:var(--muted)}

.rank .n{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--muted);text-align:center}
.rank.first{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 6%,var(--card))}.rank.first .n{color:var(--ok)}
.bars{display:grid;grid-template-columns:120px 1fr 44px;gap:6px 10px;align-items:center;font-size:12px;margin-top:10px}
.bars i{display:block;height:8px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.bars i b{display:block;height:100%;border-radius:9px;background:var(--teal-2);transition:width .9s var(--ease)}

/* ---------- Deal room ---------- */
.clocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

.clock .ring{width:64px;height:64px}
.clock .t{font-family:var(--f-mono);font-size:17px;font-weight:700;letter-spacing:-.02em}
.clock.done{opacity:.6}.clock.done .t{text-decoration:line-through}
.clock.hot{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in oklab,var(--bad) 18%,transparent)}
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0 14px}
.tl .ev::before{content:"";position:absolute;left:-26px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--line);transition:all .4s var(--ease)}
.tl .ev.done::before{background:var(--ok);border-color:var(--ok)}
.tl .ev.now::before{background:var(--signal);border-color:var(--signal);box-shadow:0 0 0 6px color-mix(in oklab,var(--signal) 22%,transparent);animation:pulse 1.6s infinite}

.savings{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px;background:linear-gradient(135deg,#10232C,#0F5B63);color:#F5F2EA}

.savings::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,61,.35),transparent 70%)}
.escrow-id{font-family:var(--f-mono);font-size:20px;font-weight:800;letter-spacing:.04em;padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--mint);display:inline-block}

.docs .d .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--bg-2)}
.docs .d.ok .ic{background:var(--ok);color:#fff}
.progress{height:10px;border-radius:99px;background:var(--bg-2);overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:99px;transition:width .8s var(--ease)}

.kpi{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card)}

.chart svg{width:100%;height:auto;display:block}

.age{font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px}

.toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}

.demo .btn{min-height:34px;padding:6px 12px;font-size:12.5px;border-radius:10px}
.spot{outline:3px solid var(--signal)!important;outline-offset:4px;border-radius:14px;transition:outline .3s;animation:spot 1.4s ease-in-out infinite}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:120}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:210px;height:210px;padding:10px;background:#fff;border-radius:14px}
.qr i{background:#10232C}.qr b{background:#fff}
.phone{width:280px;border-radius:38px;border:10px solid #10232C;background:var(--card);padding:16px;box-shadow:var(--shadow-lg);min-height:480px}
.gauge text{font-family:var(--f-display)}
.empty{padding:40px;text-align:center;border:2px dashed var(--line);border-radius:18px;color:var(--muted)}
.bottomnav{display:none}
.footer{max-width:1240px;margin:50px auto 0;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:1280px){.app.notes-on{grid-template-columns:220px 1fr 320px}.app{grid-template-columns:220px 1fr}}

  .side{display:none}

  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--ink-2);padding:6px 8px;border-radius:10px}
  .bottomnav a.on{color:var(--signal)}
  .bottomnav a svg{width:20px;height:20px}
  .search-layout{grid-template-columns:1fr}.mapwrap{position:relative;top:0}
  .detail-grid{grid-template-columns:1fr}

  .how{grid-template-columns:repeat(2,1fr)}
}

  .top{flex-wrap:wrap;gap:8px}.roles{order:5;width:100%;overflow:auto}.roles button{flex:1;padding:7px 8px;font-size:12px}

  .facts{grid-template-columns:repeat(2,1fr)}
  .gallery{grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr 1fr;height:420px}.gallery .g:first-child{grid-column:1/3;grid-row:1}
  .photos{grid-template-columns:repeat(2,1fr)}
  .how{grid-template-columns:1fr}
  .filters{position:static}
  .demo-btn span{display:none}
}

function toast(msg,kind="ok",ms=3400){
  const t=document.createElement("div");t.className="toast "+kind;t.setAttribute("role","status");
  t.innerHTML=`<span class="ti">${kind==="ok"?"✓":kind==="warn"?"!":"×"}</span><div>${msg}</div>`;
  $("#toasts").appendChild(t);setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),320)},ms);
}
function notify(t,r="/",kind="ok",silent){S.notifs.unshift({id:Date.now()+Math.random(),t,at:Date.now(),read:false,r});S.notifs=S.notifs.slice(0,40);save();bellDot();if(!silent)toast(t,kind)}
function bellDot(){const n=S.notifs.filter(x=>!x.read).length,d=$("#bellDot");if(!d)return;d.hidden=!n;d.textContent=n}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago"}

const feeOf=p=>p*FEE;
const keptVsTypical=(p,typ=S.typical)=>Math.max(0,p*(typ/100)-feeOf(p));
function countUp(el,to,ms=1200){const from=+el.dataset.from||0;const t0=performance.now();el.dataset.from=to;
  const step=t=>{const k=clamp((t-t0)/ms,0,1),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function runCounters(){$$("[data-count]").forEach(el=>countUp(el,+el.dataset.count))}

/* ---------- Offer comparison (seller) ---------- */
let explain=false;
function scoreOffers(list,l){
  const nets=list.map(o=>{const r=o.rounds[o.rounds.length-1];return r.price-(r.credit||0)-feeOf(r.price)-r.price*.01});
  const mn=Math.min(...nets),mx=Math.max(...nets);
  return list.map((o,i)=>{const r=o.rounds[o.rounds.length-1];
    const net=nets[i], sNet=mx===mn?100:60+40*(net-mn)/(mx-mn);
    const sRisk=clamp(100-o.insp*2.2-(o.appr?14:0)-o.loan*1.1,0,100);
    const sTime=clamp(100-(r.close-14)*1.6,0,100);
    const sFin=FIN[o.fin][1];
    const total=.4*sNet+.25*sRisk+.15*sTime+.2*sFin;
    const why=[];
    why.push(`Net to seller about ${fmt(net)} after the 1% fee, credit and est. 1% closing costs.`);
    why.push(o.insp?`${o.insp}-day inspection${o.appr?", appraisal":""}${o.loan?", "+o.loan+"-day loan":""} contingency.`:"Inspection waived"+(o.loan?`, ${o.loan}-day loan contingency.`:", no loan contingency."));
    why.push(`${FIN[o.fin][0]} · closes in ${r.close} days.`);
    return {o,r,net,sNet,sRisk,sTime,sFin,total,why};
  }).sort((a,b)=>b.total-a.total);
}

function comps(w){const r=rng(w.sqft*3+w.beds*17+(w.region||"la").length);const base=PPSF[w.region]||500;
  return Array.from({length:5},(_,i)=>{const sq=Math.round(w.sqft*(.85+r()*.3)/10)*10, pp=base*(.9+r()*.2)*(1+(w.beds-3)*.02);
   return{n:"Comp "+"ABCDE"[i],addr:(200+i*37)+" Comparable St (example)",sqft:sq,beds:clamp(w.beds+(i%3)-1,1,6),price:Math.round(pp*sq/1000)*1000,pp,dist:(.2+r()*1.3).toFixed(1),days:Math.round(8+r()*80)}})}
function coach(w){const c=comps(w);const ws=c.map(x=>1/(+x.dist+.3)/(1+x.days/90));const sw=ws.reduce((a,b)=>a+b,0);
  const pp=c.reduce((a,x,i)=>a+x.pp*ws[i],0)/sw;const mean=c.reduce((a,x)=>a+x.pp,0)/c.length;const sd=Math.sqrt(c.reduce((a,x)=>a+(x.pp-mean)**2,0)/c.length);
  const cv=sd/mean;const ageAdj=w.year<1970?-.02:w.year>2005?.03:0;const sug=Math.round(pp*w.sqft*(1+ageAdj)/1000)*1000;
  const conf=Math.round(clamp(92-cv*260-c.reduce((a,x)=>a+x.days,0)/c.length*.12,40,95));const spread=clamp(cv*1.2,.025,.08);
  return{c,pp,sug,lo:Math.round(sug*(1-spread)/1000)*1000,hi:Math.round(sug*(1+spread)/1000)*1000,conf,cv,ageAdj}}

 "w.disc"(el){S.wizard.disc[el.dataset.i]=el.checked;save()},
 loanChoice(el){S.loan.choice=el.value;save();rerender()}
};
function ackCheck(){const ok=$$("[data-in=ackItem]").every(c=>c.checked)&&($("#acksig").value.trim().length>2);$("#ackBtn").disabled=!ok}
function handleInput(el,ev){const k=el.dataset.in;
  if(IN[k])return IN[k](el,ev);
  if(k.startsWith("o.")){const l=L(el.dataset.id);const d=getDraft(l);const f=k.slice(2);
    d[f]=el.type==="checkbox"?el.checked:["note"].includes(f)?el.value:(+el.value);
    if(f==="fin"&&d.fin==="cash")d.loan=0;
    if(f==="price"){$("#opv").textContent=`${fmt(d.price)} · ${(d.price/l.price*100).toFixed(1)}% of list`}
    $("#offerSide").innerHTML=offerSide(l,d);if(f==="fin"&&ev.type==="change")rerender();return}
  if(k.startsWith("w.")){const f=k.slice(2),w=S.wizard;w[f]=["beds","baths","sqft","year","price"].includes(f)?(+String(el.value).replace(/[^0-9.]/g,"")||0):el.value;save();
    if(f==="price"){$("#wpv").textContent=fmt(w.price);if(ev.type==="change")rerender();else{const c=coach(w);const pos=clamp((w.price-c.lo*0.94)/(c.hi*1.06-c.lo*0.94)*100,0,100);$("#pmark").style.left=pos+"%"}}
    if(f==="signed"){$("#wSubmit").disabled=w.signed.trim().length<3}
    if(f==="region"&&ev.type==="change")rerender();return}
}
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-a]");if(!el){if(!ev.target.closest(".panel,#bell"))closePanels();return}
  const fn=A[el.dataset.a];if(!fn)return;if(el.tagName!=="A"||["open","demo","notif"].includes(el.dataset.a))ev.preventDefault();fn(el,ev)});
document.addEventListener("input",ev=>{const el=ev.target.closest("[data-in]");if(el)handleInput(el,ev)});
document.addEventListener("change",ev=>{const el=ev.target.closest("[data-in]");if(el&&(el.tagName==="SELECT"||el.dataset.in==="budget"||el.type==="range"||el.type==="radio"))handleInput(el,ev)});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"){closePanels();return}
  const t=ev.target;if(/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;
  if((ev.key==="Enter"||ev.key===" ")&&t.matches("[data-a][tabindex],[role=switch]")){ev.preventDefault();t.click();return}
  if(ev.key==="n"||ev.key==="N")A.notes();
});
document.addEventListener("mouseover",ev=>{const el=ev.target.closest("[data-hover]");$$(".hl").forEach(x=>x.classList.remove("hl"));const tip=$("#maptip");
  if(!el){tip&&tip.classList.remove("show");return}const id=el.dataset.hover;$$(`[data-hover="${id}"]`).forEach(x=>x.classList.add("hl"));
  if(tip){const l=L(id),[x,y]=proj(l.lng,l.lat),svg=$("#mapsvg"),k=svg.getBoundingClientRect().width/560;tip.style.left=x*k+"px";tip.style.top=(y-30)*k+"px";tip.innerHTML=`<b>${fmt(l.price)}</b> · ${l.beds} bd · ${l.path==="A"?"Path A":"Path B"}<br><span class="muted">${esc(l.addr)}</span>`;tip.classList.add("show")}});

/* ================= GUIDED DEMO (~2 min, Path A end to end) ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function spot(sel){$$(".spot").forEach(x=>x.classList.remove("spot"));const el=typeof sel==="string"?$(sel):sel;if(el){el.classList.add("spot");el.scrollIntoView({behavior:"smooth",block:"center"})}}
async function typeInto(sel,text,cb){const el=$(sel);if(!el)return;el.value="";for(const ch of text){el.value+=ch;el.dispatchEvent(new Event("input",{bubbles:true}));await sleep(55)}cb&&cb()}
const setRole=r=>{S.role=r;save();$$(".roles button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===r))};
const Demo={on:false,paused:false,i:0,el:null,
 steps:[
  {d:8000,cap:"Speed Estate: sell for 1%, keep the rest. Two paths, one flat fee, statewide California.",run:async()=>{setRole("buyer");go("/");await sleep(500);spot("#hero")}},
  {d:7000,cap:"A homeowner lists seller-direct (Path A). Step 1: the property, with a fictional address.",run:async()=>{setRole("seller");S.wizard=seedState().wizard;S.wizard.photos=[0,1,2];save();go("/sell");await sleep(600);spot("#wizcard")}},
  {d:10000,cap:"The pricing coach suggests a price and range from 5 example comps, with a confidence meter.",run:async()=>{S.wizard.step=3;S.wizard.price=0;save();coachExplain=true;rerender();await sleep(500);spot("#wizcard");await sleep(3500);A.useSug()}},
  {d:10000,cap:"The seller signs a seller-only, limited-scope agreement: they host showings, Speed Estate represents only them, 1% at close.",run:async()=>{coachExplain=false;S.wizard.step=5;save();rerender();await sleep(500);spot("#wsig");await typeInto("#wsig","Example Seller");await sleep(800);A.submitListing()}},
  {d:8000,cap:"A designated broker reviews it before it goes live (FR-SELR-03). Approved.",run:async()=>{setRole("admin");go("/admin");await sleep(700);spot("#reviewq");await sleep(2500);const b=$("#reviewq [data-a=approve]");b&&A.approve(b)}},
  {d:8000,cap:"A buyer searches statewide. Speed Estate listings sort first; the map stays in sync.",run:async()=>{setRole("buyer");S.filters=seedState().filters;save();go("/search");await sleep(700);const id=S.wizard.listingId;$$(`[data-hover="${id}"]`).forEach(x=>x.classList.add("hl"));spot(`.lc[data-id="${id}"]`)}},
  {d:8000,cap:"On the listing page, the fee is plain: the seller pays 1%, the buyer pays Speed Estate nothing.",run:async()=>{go("/listing/"+S.wizard.listingId);await sleep(700);spot("#feebox")}},
  {d:8000,cap:"The buyer books a showing the seller hosts. The seller confirms in the app.",run:async()=>{go("/showing/"+S.wizard.listingId);await sleep(700);const b=$(".slot");b&&A.pickSlot(b);spot("#slots");await sleep(1200);A.requestShow($("#reqShow"))}},
  {d:8000,cap:"Before any Path A offer, the buyer acknowledges they're unrepresented. It gates the offer builder.",run:async()=>{go("/ack/"+S.wizard.listingId);await sleep(600);spot("#ackcard");for(const c of $$("[data-in=ackItem]")){c.checked=true;await sleep(350)}await typeInto("#acksig","Example Buyer",ackCheck);await sleep(600);A.signAck($("#ackBtn"))}},
  {d:8000,cap:"The offer builder computes strength and fee live. The buyer signs and submits.",run:async()=>{await sleep(600);spot("#offerForm");await typeInto("#osig","Example Buyer");await sleep(500);const id=S.wizard.listingId,l=L(id),d=getDraft(l);d.price=Math.round(l.price*.975/1000)*1000;const b=document.createElement("button");b.dataset.id=id;S.role="seller";A.submitOffer(b);S.role="buyer"}},
  {d:10000,cap:"The seller compares all offers by net proceeds, risk, timing and financing, with the ranking explained.",run:async()=>{setRole("seller");explain=true;go("/offers");await sleep(800);spot("#ranked");await sleep(4500);const mine=S.offers.find(o=>o.listing===S.wizard.listingId&&o.buyer==="You");if(mine){const b=document.createElement("button");b.dataset.id=mine.id;A.sellerCounter(b)}}},
  {d:9000,cap:"The buyer sees the counter, with a live response clock, and accepts. Escrow opens at that moment.",run:async()=>{explain=false;setRole("buyer");go("/offer/"+S.wizard.listingId);await sleep(900);spot("#thread");await sleep(3500);const b=$("[data-a=buyerAccept]");b&&A.buyerAccept(b)}},
  {d:9000,cap:"The deal room: escrow ID generated at acceptance, live deadline clocks, and the seller's savings.",run:async()=>{go("/deal");await sleep(700);spot("#clocks")}},
  {d:14000,cap:"Every milestone advances the timeline: earnest money, disclosures, inspection, appraisal, loan, signing, recording.",run:async()=>{spot("#timeline");for(let k=0;k<12&&Demo.on;k++){if(!S.deal||!S.deal.steps.find(x=>!x.done))break;advance();rerender();spot("#timeline");await sleep(1050)}}},
  {d:7000,cap:"Closed. The seller paid 1% and kept the rest. That's Speed Estate. Explore any screen, or turn on GROK notes (N).",run:async()=>{spot(".savings")}}
 ],
 ui(){if(!this.el){this.el=document.createElement("div");this.el.className="demo";this.el.setAttribute("role","region");this.el.setAttribute("aria-label","Guided demo");document.body.appendChild(this.el)}
  const s=this.steps[this.i];this.el.innerHTML=`<div class="row between"><span class="tiny" style="letter-spacing:.14em;text-transform:uppercase;color:#7FD8CB;font-weight:800">Guided demo · ${this.i+1}/${this.steps.length}</span><div class="row" style="gap:6px"><button class="btn ghost" style="color:#EAF3F2;border-color:#2a4a54" data-demo="pause">${this.paused?"Resume":"Pause"}</button><button class="btn ghost" style="color:#EAF3F2;border-color:#2a4a54" data-demo="next">Next</button><button class="btn" style="background:#FF6A3D;color:#fff" data-demo="exit">Exit</button></div></div><div class="cap" style="margin-top:8px">${s.cap}</div><div class="bar"><i id="dbar" style="width:0%"></i></div>`},
 async start(){if(this.on)return;if(!confirm("Run the 2-minute guided demo? It resets the example data in this browser."))return;
  const t=S.theme,nt=S.notes;S=seedState();S.theme=t;S.notes=false;save();$("#app").classList.remove("notes-on");this.on=true;this.i=0;this.paused=false;this.notes=nt;this.loop()},
 async loop(){while(this.on&&this.i<this.steps.length){const s=this.steps[this.i];this.ui();const myI=this.i;s.run().catch(e=>console.error(e));
   let el=0;while(this.on&&this.i===myI&&el<s.d){await sleep(100);if(!this.paused)el+=100;const b=$("#dbar");if(b)b.style.width=(el/s.d*100)+"%"}
   if(this.i===myI)this.i++}
  if(this.on){if(S.deal&&!S.deal.steps.find(x=>!x.done))confetti();this.stop()}},
 stop(){this.on=false;$$(".spot").forEach(x=>x.classList.remove("spot"));if(this.el){this.el.remove();this.el=null}S.notes=this.notes!==false;save();$("#app").classList.toggle("notes-on",S.notes);toast("Demo finished. Everything you saw is still clickable.")}
};
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-demo]");if(!b)return;const k=b.dataset.demo;if(k==="pause"){Demo.paused=!Demo.paused;Demo.ui()}else if(k==="next"){Demo.i++}else if(k==="exit"){Demo.i=99;Demo.stop()}});

shell();render();bellDot();
if(!localStorage.getItem(KEY+"-seen")){localStorage.setItem(KEY+"-seen","1");setTimeout(()=>toast("Tip: press <b>Guided demo</b> for a 2-minute walkthrough. GROK notes are on the right (N to toggle)."),900)}
window.__SE={S:()=>S,go,Demo};
})();
